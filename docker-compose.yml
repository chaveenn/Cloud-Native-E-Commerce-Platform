version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-auth-service:
    env_file:
      - ./UserAuthenticationService/.env
    build:
      context: ./UserAuthenticationService
      dockerfile: Dockerfile
    container_name: user-auth-service
    ports:
      - "5002:5002"
    environment:
      - JWT_SECRET=super_secret_jwt_key_here
      - PORT=5002

  shop-service:
    env_file:
      - ./ShopManagementService/.env
    build:
      context: ./ShopManagementService
      dockerfile: Dockerfile
    container_name: shop-service
    ports:
      - "4040:4040"
    environment:
      - JWT_SECRET=super_secret_jwt_key_here
      - PORT=4040
      - AUTH_SERVICE_URL=http://user-auth-service:5002
      - ORDER_SERVICE_URL=http://order-service:4000

  order-service:
    env_file:
      - ./OrderManagementService/.env
    build:
      context: .
      dockerfile: OrderManagementService/Dockerfile
    container_name: order-service
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=super_secret_jwt_key_here
      - SHOP_SERVICE_URL=http://shop-service:4040/api
      - AUTH_SERVICE_URL=http://user-auth-service:5002
      - DELIVERY_SERVICE_URL=http://delivery-service:5003
      - SERVICE_TO_SERVICE_TOKEN=my_internal_service_token
      - RABBITMQ_URL=amqp://rabbitmq
      - PORT=4000
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  delivery-service:
    env_file:
      - ./DeliveryManagementService/.env
    build:
      context: ./DeliveryManagementService
      dockerfile: Dockerfile
    container_name: delivery-service
    ports:
      - "5003:5003"
    environment:
      - JWT_SECRET=super_secret_jwt_key_here
      - AUTH_SERVICE_URL=http://user-auth-service:5002
      - ORDER_SERVICE_URL=http://order-service:4000
      - SERVICE_TO_SERVICE_TOKEN=my_internal_service_token
      - PORT=5003
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    env_file:
      - ./NotificationService/.env
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=super_secret_jwt_key_here
      - RABBITMQ_URL=amqp://rabbitmq
      - PORT=5000
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - user-auth-service
      - shop-service
      - order-service
      - notification-service
      - delivery-service